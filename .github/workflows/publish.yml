name: Публикация в Instagram и Facebook
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "check: проверить токен; dry-run: показать, что уйдёт; publish: опубликовать; profile: оформить страницу Facebook; delete: удалить посты из social/delete.yaml; links: ссылки на опубликованные посты; tg-setup: подключить Telegram-бота к сайту"
        type: choice
        options: [check, dry-run, publish, profile, delete, links, tg-setup]
        default: check

concurrency: publish

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pyyaml
      - name: Публикация
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ vars.TELEGRAM_CHANNEL }}
          TELEGRAM_WEBHOOK_URL: ${{ vars.TELEGRAM_WEBHOOK_URL }}
          MEDIA_BASE: ${{ vars.MEDIA_BASE || 'https://raw.githubusercontent.com/790azat/portfolio/main/site' }}
          # Azat 2026-09-28: пока evnweb.am не открывается (домен .am не делегирован), картинки берутся с GitHub. Потом вернуть https://evnweb.am
          MODE: ${{ github.event.inputs.mode || 'publish' }}
        run: |
          if [ -z "$META_PAGE_TOKEN" ]; then
            echo "::warning::Публикация пропущена: нет секрета META_PAGE_TOKEN"
            exit 0
          fi
          case "$MODE" in
            check) python social/publish.py --check ;;
            dry-run) python social/publish.py --dry-run ;;
            profile) python social/profile.py ;;
            links) python social/permalinks.py ;;
            tg-setup) python social/tg_setup.py ;;
            delete) python social/delete.py ;;
            *) python social/publish.py ;;
          esac
      - name: Записать, что опубликовано
        if: always()
        run: |
          git config user.name "evnweb-bot"
          git config user.email "evnweb-bot@users.noreply.github.com"
          git add social/published.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Публикации: обновлён журнал [skip ci]"
            # другой запуск или мерж мог обновить main: подтягиваем и пробуем снова, иначе журнал потеряется и пост выйдет дважды
            ok=; for i in 1 2 3 4; do git pull --rebase -q && git push && ok=1 && break; sleep 5; done; [ -n "$ok" ]
          fi
