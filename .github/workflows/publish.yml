name: Публикация в Instagram и Facebook
on:
  schedule:
    - cron: "5,35 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "check: проверить токен; dry-run: показать, что уйдёт; publish: опубликовать"
        type: choice
        options: [check, dry-run, publish]
        default: check

concurrency: publish

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q pyyaml
      - name: Публикация
        env:
          META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
          MEDIA_BASE: ${{ vars.MEDIA_BASE || 'https://evnweb.am' }}
          MODE: ${{ github.event.inputs.mode || 'publish' }}
        run: |
          if [ -z "$META_PAGE_TOKEN" ]; then
            echo "::warning::Публикация пропущена: нет секрета META_PAGE_TOKEN"
            exit 0
          fi
          case "$MODE" in
            check) python social/publish.py --check ;;
            dry-run) python social/publish.py --dry-run ;;
            *) python social/publish.py ;;
          esac
      - name: Записать, что опубликовано
        if: always()
        run: |
          git config user.name "evnweb-bot"
          git config user.email "evnweb-bot@users.noreply.github.com"
          git add social/published.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Публикации: обновлён журнал [skip ci]"
            git push
          fi
