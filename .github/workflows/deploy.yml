name: Выкладка на SmartApe
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Проверка перед выкладкой
        run: python scripts/check.py
      - name: Заливка по SFTP (папка site/ заменяет всё содержимое на сервере)
        env:
          HOST: ${{ vars.SFTP_HOST || 'shared-33.smartape.net' }}
          PORT: ${{ vars.SFTP_PORT || '22122' }}
          USER: ${{ secrets.SFTP_USER }}
          PASS: ${{ secrets.SFTP_PASSWORD }}
          REMOTE: ${{ vars.SFTP_PATH || 'www/s18113211.smrtp.ru' }}
        run: |
          if [ -z "$USER" ] || [ -z "$PASS" ]; then
            echo "::warning::Выкладка пропущена: задайте секреты SFTP_USER и SFTP_PASSWORD"
            exit 0
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          LFTP_PASSWORD="$PASS" lftp --env-password -u "$USER" -p "$PORT" "sftp://$HOST" -e "
            set sftp:auto-confirm yes;
            set net:max-retries 3; set net:timeout 30;
            mirror -R --delete --verbose --exclude-glob .well-known/ site/ $REMOTE/;
            bye"
