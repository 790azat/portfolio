name: Выкладка на SmartApe
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Проверка перед выкладкой
        run: python scripts/check.py
      - name: Настройки Telegram-бота (из секрета, в репозиторий не попадают)
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          # как в social/tg.py: без пробелов и без приставки "bot"
          TG_TOKEN=$(printf '%s' "$TG_TOKEN" | tr -d '[:space:]' | sed -E 's/^[Bb][Oo][Tt]([0-9]+:)/\1/')
          if [ -n "$TG_TOKEN" ]; then
            SECRET=$(printf '%s' "$TG_TOKEN" | sha256sum | cut -c1-32)
            printf "<?php\nconst TG_TOKEN = '%s';\nconst TG_SECRET = '%s';\n" "$TG_TOKEN" "$SECRET" > site/bot/config.php
          else
            echo "Бот не настроен: нет секрета TELEGRAM_BOT_TOKEN"; rm -rf site/bot
          fi
      - name: Заливка по SFTP (папка site/ заменяет всё содержимое на сервере)
        env:
          HOST: ${{ vars.SFTP_HOST || 'shared-33.smartape.net' }}
          PORT: ${{ vars.SFTP_PORT || '22122' }}
          USER: ${{ secrets.SFTP_USER }}
          PASS: ${{ secrets.SFTP_PASSWORD }}
          REMOTE: ${{ vars.SFTP_PATH || 'www/evnweb.am' }}
          MIRROR: ${{ vars.SFTP_MIRROR_PATH || 'www/s18113211.smrtp.ru' }}
        run: |
          if [ -z "$USER" ] || [ -z "$PASS" ]; then
            echo "::warning::Выкладка пропущена: задайте секреты SFTP_USER и SFTP_PASSWORD"
            exit 0
          fi
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp
          # Понятная ошибка вместо «max-retries exceeded»: сначала порт, потом вход.
          # SmartApe иногда не отвечает на первое подключение: до 4 попыток с паузой.
          for i in 1 2 3 4; do
            if timeout 20 bash -c "</dev/tcp/$HOST/$PORT" 2>/dev/null; then
              echo "Порт $HOST:$PORT открыт (попытка $i)"; break
            fi
            if [ "$i" = 4 ]; then
              echo "::error::Сервер $HOST:$PORT не отвечает (хостинг недоступен или блокирует GitHub)"
              exit 1
            fi
            echo "Порт не ответил, попытка $i из 4, жду 20 секунд"; sleep 20
          done
          if ! LFTP_PASSWORD="$PASS" lftp --env-password -u "$USER" -p "$PORT" "sftp://$HOST" -e "
            set sftp:auto-confirm yes; set net:max-retries 1; set net:timeout 20;
            mkdir -p -f $REMOTE; cls -1 $REMOTE/ > /dev/null; bye"; then
            echo "::error::Не удалось войти по SFTP или создать папку $REMOTE: проверьте секреты SFTP_USER / SFTP_PASSWORD и переменную SFTP_PATH"
            exit 1
          fi
          echo "Вход по SFTP успешен, папка $REMOTE на месте"
          LFTP_PASSWORD="$PASS" lftp --env-password -u "$USER" -p "$PORT" "sftp://$HOST" -e "
            set sftp:auto-confirm yes;
            set net:max-retries 3; set net:timeout 30;
            mirror -R --delete --verbose --exclude-glob .well-known/ --exclude-glob bot/data/ site/ $REMOTE/;
            bye"
          # Запасная копия на техническом адресе SmartApe: пока evnweb.am не открывается, Telegram-бот работает отсюда.
          if [ -n "$MIRROR" ]; then
            LFTP_PASSWORD="$PASS" lftp --env-password -u "$USER" -p "$PORT" "sftp://$HOST" -e "
              set sftp:auto-confirm yes;
              set net:max-retries 3; set net:timeout 30;
              mkdir -p -f $MIRROR;
              mirror -R --delete --exclude-glob .well-known/ --exclude-glob bot/data/ site/ $MIRROR/;
              bye" && echo "Копия выложена в $MIRROR" || echo "::warning::Не удалось выложить копию в $MIRROR"
          fi
