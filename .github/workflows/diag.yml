name: diag
on:
  push:
    branches: [claude/diag-dns]
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://raw.githubusercontent.com/790azat/portfolio/main/site/m
          for u in $B/profile/avatar.jpg $B/2026-10-nedelya-1/06-reel-restoran/reel.mp4; do curl -sSI -m 20 "$u" | grep -iE "^HTTP|content-type|content-length"; done
          whois evnweb.am 2>/dev/null | head -30 || true
          dig @ns1.smartape.ru +short A evnweb.am || true
