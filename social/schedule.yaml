    Հյուրը ուզում է ընթրել ձեզ մոտ։ Ի՞նչ է լինում հետո, եթե ռեստորանն ունի EVNWEB-ի կայք։

    1. Հյուրը բացում է մենյուն հեռախոսով՝ լուսանկարներ, գներ, զամբյուղ։
    2. Մեկ րոպեում ամրագրում է սեղան։
    3. Հայտն անմիջապես հասնում է ադմինիստրատորին, նա հաստատում է մեկ կոճակով։
    4. Մենյուն և գները փոխում եք ինքներդ՝ առանց ծրագրավորողի։

    Այս ամենն աշխատում է մեր Tsiran դեմո-ռեստորանում։ Գրեք «ԴԵՄՈ» Telegram, WhatsApp կամ Viber՝ +374 93 40-11-79, կուղարկեմ հղումը։

    ———

    Гость хочет поужинать у вас. Что происходит дальше, если у ресторана есть сайт от EVNWEB?

    1. Гость открывает меню с телефона: фото, цены, корзина.
    2. Бронирует столик за минуту.
    3. Заявка сразу падает администратору, он подтверждает её одной кнопкой.
    4. Меню и цены вы меняете сами, без программиста.

    Всё это работает в нашем демо-ресторане Tsiran. Напишите «ДЕМО» в Telegram, WhatsApp или Viber: +374 93 40-11-79, пришлю ссылку.

