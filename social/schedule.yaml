    Աջակցություն՝ ամսական 25 000 ֏-ից, առաջին 3 ամիսն անվճար է։

    Ճշգրիտ գինը կասեմ 20 րոպեանոց զրույցից հետո։ Telegram, WhatsApp, Viber՝ +374 93 40-11-79։

    ———

    Сколько стоит сайт в 2026 году:

    • лендинг или сайт-визитка: от 150 000 ֏
    • ресторан или кафе (меню, бронь, админка): от 280 000 ֏
    • отель (бронь номеров, шахматка): от 450 000 ֏, с онлайн-оплатой от 900 000 ֏
    • интернет-магазин: от 400 000 ֏
